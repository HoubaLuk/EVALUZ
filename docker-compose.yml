version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: evaluz_db
    restart: always
    environment:
      POSTGRES_USER: evaluz_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
      POSTGRES_DB: evaluz_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U evaluz_admin -d evaluz_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: evaluz_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://evaluz_admin:${POSTGRES_PASSWORD:-securepassword123}@db:5432/evaluz_db
      # Optional: LLM adresa
      # - VLLM_API_URL=http://your-gpu-server:8000/v1
    # Port 8000 NENÍ exponován navenek — přístup pouze přes Nginx proxy
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./logs/llm_parse_errors:/app/logs/llm_parse_errors

  frontend:
    build:
      context: .
    container_name: evaluz_frontend
    restart: always
    ports:
      - "8001:80"   # HTTP → přesměrování na HTTPS
      - "8443:443" # HTTPS (self-signed nebo vlastní certifikát)
    volumes:
      - ./ssl:/etc/nginx/ssl:ro  # SSL certifikát (vygenerovat pomocí generate-ssl.sh)
    depends_on:
      - backend

volumes:
  pgdata:
