# =============================================================================
# EVALUZ — nginx reverse proxy konfigurace
# Externý reverse proxy (HAProxy / nginx na hostiteli) terminuje SSL/TLS.
# Tento nginx přijímá čistý HTTP od externého proxy a routuje provoz.
#
# Routing:
#   /api/   →  backend:8000  (FastAPI)
#   /       →  frontend:80   (React / nginx statické soubory)
#
# Až dostanete doménu a HTTPS:
#   - Nastavte CORS_ORIGINS=https://vas-domen.cz v .env
#   - Externý reverse proxy přidá hlavičky X-Forwarded-Proto, X-Real-IP
# =============================================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Přeposlat reálnou IP z externího reverse proxy
    set_real_ip_from  0.0.0.0/0;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Bezpečnostní hlavičky
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin"   always;

    # Velikost uploadu — dokumenty mohou být větší
    client_max_body_size 50M;

    # ── API endpointy → FastAPI backend ──────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout pro dlouhé AI operace (evaluace může trvat desítky sekund)
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket podpora (eval_queue notifikace) ─────────────────────────────
    location /ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Health check (bez logování) ───────────────────────────────────────────
    location = /api/v1/health {
        proxy_pass http://backend;
        access_log off;
    }

    # ── Frontend (React SPA) ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
