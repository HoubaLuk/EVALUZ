# =============================================================================
# EVALUZ — nginx reverse proxy konfigurace
# Externý reverse proxy (HAProxy / nginx hostitele) terminuje SSL/TLS.
# Tento nginx přijímá čistý HTTP od externého proxy a routuje provoz.
#
# Routing:
#   /api/   →  backend:8000  (FastAPI)
#   /       →  frontend:80   (React / nginx statické soubory)
# =============================================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Reálná IP z externího reverse proxy.
    # PRODUKCE: nahraďte 0.0.0.0/0 konkrétní IP vašeho HAProxy/nginx hostitele.
    # Příklad: set_real_ip_from 10.10.0.1;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Limit pro upload souborů (ÚZ dokumenty, max 15 MB)
    client_max_body_size 15M;

    # Bezpečnostní hlavičky
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header X-Frame-Options            "DENY"                          always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    # CSP: povoluje jen vlastní origin, inline styly (React potřebuje), bez externích zdrojů
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'; frame-ancestors 'none';" always;

    # ── API endpointy → FastAPI backend ──────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout pro dlouhé AI operace (evaluace může trvat desítky sekund)
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Buffer pro velké odpovědi (PDF export, AI výstupy)
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # ── WebSocket podpora (eval_queue notifikace) ─────────────────────────────
    location /api/v1/evaluate/ws {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Health check (bez logování) ───────────────────────────────────────────
    location = /api/v1/health {
        proxy_pass http://backend;
        access_log off;
    }

    # ── Frontend (React SPA) ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # SPA fallback — vše co není soubor jde na index.html
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        proxy_pass http://frontend;
    }
}
