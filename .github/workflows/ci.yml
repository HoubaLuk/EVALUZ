name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint + migrace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalace závislostí
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: |
          cd backend
          ruff check . --select E,F,W --ignore E501 --exclude alembic/

      - name: Ověření Alembic migrací (SQLite)
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          cd backend
          alembic upgrade head
          alembic check
          rm -f ci_test.db

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalace závislostí
        run: npm ci

      - name: Build
        run: npm run build

  # ─── Docker Compose validace ─────────────────────────────────────────────────
  docker-compose:
    name: Docker Compose — validace konfigurace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validace docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validace docker-compose.prod.yml
        run: |
          # Vytvořit dummy .env aby config neselhal na chybějících proměnných
          echo "POSTGRES_PASSWORD=ci_dummy" > .env
          docker compose -f docker-compose.prod.yml config --quiet
          rm .env
