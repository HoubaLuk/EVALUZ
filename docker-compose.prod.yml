# =============================================================================
# EVALUZ — Produkční Docker Compose
#
# Použití:
#   cp .env.example .env          # nastavte hodnoty
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Architektura:
#   [Externí reverse proxy / nginx hostitele]
#       └── :80 → nginx (evaluz_proxy)
#                    ├── /api/  → backend:8000
#                    └── /      → frontend:80
#
# Porty exponované na hostitele:
#   - 3000:80  → nginx proxy (frontend + API přes jednu bránu)
#   Backend a frontend jsou interní — nepřístupné přímo z hostitele.
# =============================================================================

version: '3.8'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: evaluz_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: evaluz_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evaluz_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluz_admin -d evaluz_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # DB není dostupná přímo z hostitele — pouze přes interní síť
    networks:
      - internal

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evaluz_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://evaluz_admin:${POSTGRES_PASSWORD}@db:5432/evaluz_db
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
    # Backend není dostupný přímo — pouze přes nginx proxy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── React Frontend (nginx statické soubory) ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evaluz_frontend
    restart: always
    # Frontend není dostupný přímo — pouze přes nginx proxy
    networks:
      - internal

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  proxy:
    image: nginx:1.25-alpine
    container_name: evaluz_proxy
    restart: unless-stopped
    ports:
      - "3000:80"   # Externý reverse proxy / firewall směruje sem
    volumes:
      - ./nginx/evaluz.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -sf http://localhost/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
